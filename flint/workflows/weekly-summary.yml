name: Weekly Summary

on:
  schedule:
    # 06:10 UTC every Monday = 00:10 America/Mexico_City (UTC-6).
    # Fires just after midnight Monday local, summarizing the Mon-Sun week
    # that just ended.
    - cron: "10 6 * * 1"
  workflow_dispatch:
    inputs:
      week_start:
        description: "Week start date (Monday, YYYY-MM-DD). Empty = previous Monday in FLINT_TIMEZONE."
        required: false
        default: ""

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Generate weekly summary
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          FLINT_TIMEZONE: ${{ secrets.FLINT_TIMEZONE }}
          INPUT_WEEK_START: ${{ github.event.inputs.week_start }}
        run: |
          if [ -n "$INPUT_WEEK_START" ]; then
            node dashboard/scripts/generate-weekly-summary.mjs --week-start "$INPUT_WEEK_START"
          else
            node dashboard/scripts/generate-weekly-summary.mjs
          fi
