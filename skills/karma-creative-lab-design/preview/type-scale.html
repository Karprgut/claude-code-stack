<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--karma-white)}
  .wrap{padding:16px 20px;border:var(--border-std);background:var(--karma-white)}
  .row{display:grid;grid-template-columns:110px 1fr 180px;align-items:center;gap:16px;padding:6px 0;border-bottom:1px solid var(--karma-gray-200)}
  .row:last-child{border-bottom:0}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--karma-gray-500)}
  .spec{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--karma-gray-500);text-align:right}
  .s{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:-0.03em;line-height:1;color:#0A0A0A}
</style></head><body>
  <div class="wrap">
    <div class="row"><span class="lbl">H1</span><span class="s" style="font-size:48px">Estructura</span><span class="spec">96–192px · Grotesk 900</span></div>
    <div class="row"><span class="lbl">H2</span><span class="s" style="font-size:34px">Laboratorio</span><span class="spec">72–144px · Grotesk 900</span></div>
    <div class="row"><span class="lbl">H3</span><span class="s" style="font-size:24px">Servicios</span><span class="spec">48–64px · Grotesk 700</span></div>
    <div class="row"><span class="lbl">H4</span><span class="s" style="font-size:18px">Pilares</span><span class="spec">24–40px · Grotesk 700</span></div>
  </div>
</body></html>
