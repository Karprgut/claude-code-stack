<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--karma-white)}
  .wrap{padding:24px;background:var(--karma-white);border:var(--border-std)}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;align-items:start}
  .cell{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--karma-gray-500)}
  .btn{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:14px 24px;border:4px solid #0A0A0A;font-size:14px;cursor:pointer;display:inline-block;text-decoration:none;line-height:1}
  .primary{background:#00FF41;color:#0A0A0A;box-shadow:6px 6px 0 0 #0A0A0A}
  .secondary{background:#0A0A0A;color:#FAFAFA;box-shadow:6px 6px 0 0 #00FF41}
  .ghost{background:transparent;color:#0A0A0A;box-shadow:none}
  .hover{transform:translate(3px,3px);box-shadow:3px 3px 0 0 #0A0A0A}
</style></head><body>
  <div class="wrap">
    <div class="row">
      <div class="cell">
        <span class="lbl">Primary</span>
        <a class="btn primary">EXPLORAR SISTEMA</a>
        <a class="btn primary hover">HOVER ↓</a>
      </div>
      <div class="cell">
        <span class="lbl">Secondary</span>
        <a class="btn secondary">VER MÁS</a>
        <a class="btn secondary">DESCUBRE →</a>
      </div>
      <div class="cell">
        <span class="lbl">Ghost</span>
        <a class="btn ghost">LEER MÁS</a>
        <a class="btn ghost" style="background:#0A0A0A;color:#FAFAFA">INVERT →</a>
      </div>
    </div>
  </div>
</body></html>
