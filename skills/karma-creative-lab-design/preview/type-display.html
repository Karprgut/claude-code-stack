<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--karma-white)}
  .wrap{padding:20px 24px;border:var(--border-std);background:var(--karma-white)}
  .big{font-family:var(--font-display);font-weight:700;text-transform:uppercase;line-height:.88;letter-spacing:-0.05em;color:#0A0A0A;font-size:110px;margin-bottom:12px}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:24px}
  .spec{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--karma-gray-500)}
  .name{font-family:var(--font-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:-0.02em}
</style></head><body>
  <div class="wrap">
    <div class="big">KARMA</div>
    <div class="row">
      <span class="name">Space Grotesk · 700/900</span>
      <span class="spec">Display · Uppercase · −0.04em · LH 0.9</span>
    </div>
  </div>
</body></html>
