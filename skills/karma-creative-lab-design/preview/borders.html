<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Borders & radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--karma-white)}
  .wrap{padding:20px 24px;background:var(--karma-white);border:var(--border-std)}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .box{height:72px;background:var(--karma-white);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:-0.02em;color:#0A0A0A}
  .b2{border:2px solid #0A0A0A}
  .b4{border:4px solid #0A0A0A}
  .b8{border:8px solid #0A0A0A}
  .br{border:4px solid #FF0033}
  .label{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--karma-gray-500);margin-top:10px;text-align:center}
  .cell{display:flex;flex-direction:column}
</style></head><body>
  <div class="wrap">
    <div class="row">
      <div class="cell"><div class="box b2">2px</div><div class="label">Thin · internal</div></div>
      <div class="cell"><div class="box b4">4px</div><div class="label">Standard</div></div>
      <div class="cell"><div class="box b8">8px</div><div class="label">Statement</div></div>
      <div class="cell"><div class="box br">Red 4px</div><div class="label">Accent border</div></div>
    </div>
  </div>
</body></html>
