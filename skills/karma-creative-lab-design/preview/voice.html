<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Voice & phrases</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--karma-white)}
  .wrap{padding:24px 28px;background:#0A0A0A;color:#FAFAFA;border:var(--border-std);min-height:150px;position:relative;overflow:hidden}
  .eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#00FF41;margin-bottom:14px}
  .q{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:28px;line-height:1;letter-spacing:-0.03em;margin-bottom:8px}
  .q .r{color:#FF0033}
  .meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#888;position:absolute;bottom:12px;right:16px}
  .star{position:absolute;top:16px;right:22px;font-size:22px;color:#00FF41}
</style></head><body>
  <div class="wrap">
    <div class="eyebrow">NUCLEAR PHRASES · 06</div>
    <div class="q">Estructuras que piensan.</div>
    <div class="q">Procesar es <span class="r">crear.</span></div>
    <div class="q">El ruido también es lenguaje.</div>
    <div class="star">★</div>
    <div class="meta">KARMA-LAB-2025 · V1.0</div>
  </div>
</body></html>
