<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sticky menu</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--karma-white)}
  .wrap{padding:20px;background:var(--karma-white);height:280px;position:relative;overflow:hidden}
  .bg{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#E5E5E5 0 1px,transparent 1px 22px), repeating-linear-gradient(90deg,#E5E5E5 0 1px,transparent 1px 22px);opacity:.6}
  .tog{position:absolute;top:24px;right:24px;width:70px;height:70px;background:#00FF41;border:4px solid #0A0A0A;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:26px;box-shadow:8px 8px 0 0 #0A0A0A}
  .postit{position:absolute;top:110px;right:24px;background:#00FF41;border:4px solid #0A0A0A;padding:18px 22px;min-width:220px;box-shadow:10px 10px 0 0 #0A0A0A}
  .postit a{display:block;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:14px;color:#0A0A0A;text-decoration:none;padding:8px 0;border-bottom:3px solid #0A0A0A;letter-spacing:-0.01em}
  .postit a:last-child{border-bottom:0}
  .postit a.active{padding-left:10px}
</style></head><body>
  <div class="wrap">
    <div class="bg"></div>
    <div class="tog">★</div>
    <div class="postit">
      <a>MANIFIESTO</a>
      <a class="active">SERVICIOS</a>
      <a>BLOG</a>
      <a>CONTACTO</a>
    </div>
  </div>
</body></html>
