<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Symbol pack</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--karma-white)}
  .wrap{padding:0;background:var(--karma-white);border:var(--border-std);display:grid;grid-template-columns:repeat(9,1fr)}
  .cell{aspect-ratio:1;background:#0A0A0A;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden;position:relative}
  .cell + .cell{border-left:2px solid #0A0A0A}
  .cell img{max-width:85%;max-height:85%;filter:invert(1)}
</style></head><body>
  <div class="wrap">
    <div class="cell"><img src="../assets/symbols/simbolo-1.webp"></div>
    <div class="cell"><img src="../assets/symbols/simbolo-2.webp"></div>
    <div class="cell"><img src="../assets/symbols/simbolo-3.webp"></div>
    <div class="cell"><img src="../assets/symbols/simbolo-4.webp"></div>
    <div class="cell"><img src="../assets/symbols/simbolo-5.webp"></div>
    <div class="cell"><img src="../assets/symbols/simbolo-6.webp"></div>
    <div class="cell"><img src="../assets/symbols/simbolo-7.webp"></div>
    <div class="cell"><img src="../assets/symbols/simbolo-8.webp"></div>
    <div class="cell"><img src="../assets/symbols/simbolo-9.webp"></div>
  </div>
</body></html>
