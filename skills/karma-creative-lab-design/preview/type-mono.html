<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mono type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--karma-white)}
  .wrap{padding:16px 20px;border:var(--border-std);background:var(--karma-white)}
  .eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--karma-gray-500);margin-bottom:10px}
  .row{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:#0A0A0A;margin:4px 0}
  .ts{font-size:11px;color:var(--karma-gray-500)}
  .tag{display:inline-block;border:2px solid var(--karma-black);padding:4px 10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-right:6px}
  .code{background:#0A0A0A;color:#00FF41;padding:8px 12px;font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;display:inline-block}
</style></head><body>
  <div class="wrap">
    <div class="eyebrow">Courier Prime · Mono</div>
    <div class="row ts">TIMESTAMP: 2025.10.06 · KARMA-LAB-01</div>
    <div class="row"><span class="tag">01 / ESTRATEGIA</span><span class="tag">SISTEMA VIVO</span></div>
    <div class="row"><span class="code">&gt; OBSERVAR → INTERPRETAR → TRAZAR</span></div>
  </div>
</body></html>
